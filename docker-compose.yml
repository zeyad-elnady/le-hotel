services:
  db:
    image: postgres:16-alpine
    container_name: lehotel_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lehotel_db}
      POSTGRES_USER: ${POSTGRES_USER:-lehotel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lehotel_password}
    volumes:
      - lehotel_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lehotel_user} -d ${POSTGRES_DB:-lehotel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: lehotel_adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lehotel_pgdata:
    name: lehotel_pgdata
